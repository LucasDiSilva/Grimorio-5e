<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17131f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Grimório"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Grimório — D&D 5e</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--bg:#17131f;--panel:#211b2a;--panel2:#2c2435;--line:#40364b;--muted:#b2a7bf;--text:#f5f0fa;--gold:#b68aff;--gold2:#d4baff;--green:#b8a0ef;--red:#e48b9b;--radius:15px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1240px;margin:auto;padding:0 28px 60px}.topbar{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand-mark{height:39px;width:39px;border:1px solid #78603c;border-radius:12px;display:grid;place-items:center;color:var(--gold);font-size:22px}.brand-name{font:600 20px 'Playfair Display',serif;letter-spacing:.4px}.brand-sub{font-size:10px;text-transform:uppercase;letter-spacing:1.9px;color:var(--muted);margin-top:2px}.top-actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:10px 14px;font-weight:600;font-size:13px;transition:.18s}.btn:hover{border-color:#70765e;background:#272d24}.btn.gold{background:var(--gold);color:#1e1b14;border-color:var(--gold);font-weight:700}.btn.gold:hover{background:var(--gold2)}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.hero{display:flex;justify-content:space-between;align-items:end;padding:36px 0 25px}.eyebrow{font-size:11px;color:var(--gold);letter-spacing:1.7px;text-transform:uppercase;font-weight:700}.hero h1{font:600 34px 'Playfair Display',serif;margin:7px 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}.workspace{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px}.sidebar,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.sidebar{padding:16px;height:max-content}.section-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}.section-head h2,.card-head h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.3px}.count{font-size:11px;color:var(--muted)}.character-list{display:grid;gap:7px}.char-item{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:11px;border-radius:10px;display:flex;align-items:center;gap:10px}.char-item:hover{background:#20251e}.char-item.active{background:#29291e;border-color:#69583d}.avatar{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:#303a2b;color:#b9c99f;font:600 15px 'Playfair Display',serif;flex:none}.char-item.active .avatar{background:#54452e;color:var(--gold2)}.char-name{font-size:13px;font-weight:600}.char-meta{font-size:11px;color:var(--muted);margin-top:3px}.empty-side{font-size:12px;color:var(--muted);text-align:center;padding:24px 10px;line-height:1.6}.main{min-width:0}.welcome{min-height:410px;display:grid;place-items:center;text-align:center;padding:40px}.welcome-icon{font-size:42px;color:var(--gold);margin-bottom:8px}.welcome h2{font:600 26px 'Playfair Display',serif;margin:8px 0}.welcome p{max-width:400px;color:var(--muted);font-size:13px;line-height:1.7;margin:0 auto 20px}.char-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.char-title{display:flex;align-items:center;gap:13px}.char-title .avatar{width:47px;height:47px;font-size:20px}.char-title h2{font:600 24px 'Playfair Display',serif;margin:0 0 4px}.char-title p{color:var(--muted);font-size:12px;margin:0}.char-controls{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:19px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.stat-value{font:600 19px 'Playfair Display',serif;margin-top:6px}.rest-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:19px}.rest-card{display:flex;align-items:center;justify-content:space-between;background:#211f18;border:1px solid #51452f;border-radius:12px;padding:14px 16px}.rest-card.long{background:#1b2025;border-color:#354452}.rest-label{font-size:13px;font-weight:700}.rest-desc{font-size:11px;color:var(--muted);margin-top:4px}.rest-card .btn{padding:8px 11px;font-size:11px;border-color:#66583b}.rest-card.long .btn{border-color:#46586a}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:15px}.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;font-weight:600;font-size:12px;margin-bottom:-1px}.tab.active{color:var(--gold2);border-color:var(--gold)}.tab-pane{display:none}.tab-pane.active{display:block}.card{padding:17px;margin-bottom:12px}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.card-head .sub{font-size:11px;color:var(--muted);margin-top:4px}.slots{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.slot{background:#20241e;border:1px solid #343b31;border-radius:10px;text-align:center;padding:11px 5px}.slot-level{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.slot-count{font:600 18px 'Playfair Display',serif;margin:5px 0}.slot-actions{display:flex;justify-content:center;gap:4px}.icon-btn{width:23px;height:23px;border:1px solid var(--line);border-radius:7px;background:#292e27;color:#d5d5c8;font-size:14px;line-height:1}.icon-btn:hover{border-color:var(--gold);color:var(--gold2)}.spell-grid{display:grid;gap:7px}.spell-row,.feature-row{display:flex;align-items:center;gap:12px;border:1px solid #2d332b;background:#1c211a;border-radius:10px;padding:10px 12px}.spell-level,.feature-kind{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.7px;min-width:49px}.spell-info{flex:1;min-width:0}.spell-name{font-size:13px;font-weight:600}.spell-note{font-size:11px;color:var(--muted);margin-top:3px}.spell-actions{display:flex;align-items:center;gap:7px}.pill{font-size:10px;border-radius:20px;padding:4px 8px;background:#293125;color:#b9ca9e}.use-btn{padding:7px 10px;font-size:11px}.empty-state{border:1px dashed #3b4338;border-radius:10px;text-align:center;color:var(--muted);padding:25px;font-size:12px;line-height:1.7}.empty-state b{display:block;color:var(--text);font-size:13px;margin-bottom:4px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;background:#17131f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 11px;outline:none;font-size:13px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.field textarea{min-height:70px;resize:vertical}.modal-wrap{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:3}.modal-wrap.open{display:grid}.modal{width:min(460px,100%);background:#1b2019;border:1px solid #3b4237;border-radius:16px;padding:21px;box-shadow:0 20px 80px #0008}.modal h2{font:600 22px 'Playfair Display',serif;margin:0 0 6px}.modal-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:17px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.danger-note{padding:11px 12px;border-radius:9px;background:#31251e;color:#e5c090;font-size:11px;line-height:1.5}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);opacity:0;transition:.2s;background:#292e25;border:1px solid #515c49;border-radius:10px;padding:10px 15px;font-size:12px;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.workspace{grid-template-columns:220px minmax(0,1fr)}.slots{grid-template-columns:repeat(5,1fr)}}@media(max-width:650px){.app{padding:0 15px 40px}.topbar{height:66px}.brand-name{font-size:18px}.brand-sub{font-size:9px}.top-actions .btn{padding:9px 10px;font-size:11px}.hero{padding:27px 0 19px}.hero h1{font-size:29px}.workspace{grid-template-columns:1fr}.sidebar{padding:12px}.character-list{display:flex;overflow:auto}.char-item{min-width:175px}.empty-side{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.char-header{align-items:flex-start}.char-controls{flex-direction:column}.char-title h2{font-size:20px}.rest-row{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}.card{padding:13px}.spell-row,.feature-row{gap:8px;padding:9px}.spell-level,.feature-kind{min-width:40px;font-size:9px}.spell-name{font-size:12px}.use-btn{padding:7px 8px}.tabs{overflow:auto}.tab{white-space:nowrap;padding:10px 11px}}
</style><link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="combat.css"><link rel="stylesheet" href="skills.css"><link rel="stylesheet" href="weapons.css"><link rel="stylesheet" href="bag.css"><link rel="stylesheet" href="magic-stats.css"><link rel="stylesheet" href="special-items.css"><link rel="stylesheet" href="themes.css"></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">Grimório</div><div class="brand-sub">Compêndio de aventureiro</div></div></div><div class="top-actions"><div class="theme-picker"><button class="btn ghost" id="themeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu">🎨 Cores</button><div class="theme-menu" id="themeMenu" role="group" aria-label="Escolher paleta" hidden><button type="button" class="theme-option" data-theme-choice="original"><span class="theme-dot original"></span>Roxo original</button><button type="button" class="theme-option" data-theme-choice="rosa"><span class="theme-dot rosa"></span>Rosa</button><button type="button" class="theme-option" data-theme-choice="azul"><span class="theme-dot azul"></span>Azul</button><button type="button" class="theme-option" data-theme-choice="verde-claro"><span class="theme-dot verde-claro"></span>Verde claro</button><button type="button" class="theme-option" data-theme-choice="verde-escuro"><span class="theme-dot verde-escuro"></span>Verde escuro</button><button type="button" class="theme-option" data-theme-choice="amarelo"><span class="theme-dot amarelo"></span>Amarelo</button><button type="button" class="theme-option" data-theme-choice="vermelho"><span class="theme-dot vermelho"></span>Vermelho</button></div></div><button class="btn ghost" id="installBtn">Instalar app</button><button class="btn ghost" id="exportBtn">Exportar</button><button class="btn gold" id="newCharacterBtn">＋ Personagem</button></div></header>
<section class="hero"><div><div class="eyebrow">Sua mesa, suas regras</div><h1>Gerencie seu grimório</h1><p>Magias, habilidades e recursos prontos para a próxima aventura.</p></div></section>
<div class="workspace"><aside class="sidebar"><div class="section-head"><h2>Personagens</h2><span class="count" id="charCount">0</span></div><div class="character-list" id="characterList"></div><div class="empty-side" id="sideEmpty">Seu grupo começa com um personagem.<br>Crie um para organizar seus recursos.</div></aside>
<main class="main" id="main"></main></div></div>
<div class="modal-wrap" id="modalWrap"><section class="modal" id="modal"></section></div><div class="toast" id="toast"></div>
<script>
const KEY='grimorio5e.v1';let state=load();let activeTab='spells';let toastTimer;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{characters:[],activeId:null}}catch{return{characters:[],activeId:null}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function current(){return state.characters.find(c=>c.id===state.activeId)||null}function showToast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function render(){renderSide();renderMain()}function renderSide(){const list=document.getElementById('characterList');document.getElementById('charCount').textContent=state.characters.length;document.getElementById('sideEmpty').classList.toggle('hidden',state.characters.length>0);list.innerHTML=state.characters.map(c=>`<button class="char-item ${c.id===state.activeId?'active':''}" data-select="${c.id}"><span class="avatar">${esc((c.name||'?').trim().slice(0,1).toUpperCase())}</span><span><span class="char-name">${esc(c.name)}</span><span class="char-meta">${esc(c.class||'Aventureiro')} · Nv. ${esc(c.level||1)}</span></span></button>`).join('');list.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state.activeId=b.dataset.select;activeTab='spells';save();render()})}
function renderMain(){const root=document.getElementById('main'),c=current();if(!c){root.innerHTML=`<div class="card welcome"><div><div class="welcome-icon">✧</div><h2>Prepare-se para a aventura</h2><p>Crie seu primeiro personagem para registrar magias, truques, espaços e habilidades. Seus dados ficam salvos neste dispositivo.</p><button class="btn gold" onclick="openCharacter()">＋ Criar personagem</button></div></div>`;return}root.innerHTML=`<div class="char-header"><div class="char-title"><span class="avatar">${esc((c.name||'?').slice(0,1).toUpperCase())}</span><div><h2>${esc(c.name)}</h2><p>${esc(c.race||'Raça não definida')} · ${esc(c.class||'Classe não definida')}${c.subclass?' ('+esc(c.subclass)+')':''} · Nível ${esc(c.level||1)}</p></div></div><div class="char-controls"><button class="btn" id="editChar">Editar</button><button class="btn danger" id="deleteChar">Excluir</button></div></div>
<div class="stats"><div class="stat"><div class="stat-label">Classe</div><div class="stat-value">${esc(c.class||'—')}</div></div><div class="stat"><div class="stat-label">Nível</div><div class="stat-value">${esc(c.level||1)}</div></div><div class="stat"><div class="stat-label">Magias</div><div class="stat-value">${c.spells.filter(s=>s.level>0).length}</div></div><div class="stat"><div class="stat-label">Habilidades</div><div class="stat-value">${c.features.length}</div></div></div>
<div class="rest-row"><div class="rest-card"><div><div class="rest-label">☼ Descanso curto</div><div class="rest-desc">Recupera recursos marcados para descanso curto.</div></div><button class="btn" id="shortRest">Descansar</button></div><div class="rest-card long"><div><div class="rest-label">☾ Descanso longo</div><div class="rest-desc">Restaura recursos marcados para descanso longo.</div></div><button class="btn" id="longRest">Descansar</button></div></div>
<div class="tabs"><button class="tab ${activeTab==='spells'?'active':''}" data-tab="spells">✧ Magias e truques</button><button class="tab ${activeTab==='features'?'active':''}" data-tab="features">⚔ Habilidades e recursos</button></div>
<section class="tab-pane ${activeTab==='spells'?'active':''}" id="spellsPane">${spellPane(c)}</section><section class="tab-pane ${activeTab==='features'?'active':''}" id="featuresPane">${featurePane(c)}</section>`;
root.querySelector('#editChar').onclick=()=>openCharacter(c.id);root.querySelector('#deleteChar').onclick=()=>confirmDelete(c.id);root.querySelector('#shortRest').onclick=()=>confirmRest('short');root.querySelector('#longRest').onclick=()=>confirmRest('long');root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderMain()});root.querySelector('#addSpell').onclick=()=>openSpell();root.querySelector('#addCantrip').onclick=()=>openSpell(null,true);root.querySelector('#addFeature').onclick=()=>openFeature();root.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>adjustSlot(+b.dataset.slot,+b.dataset.delta));root.querySelectorAll('[data-use-spell]').forEach(b=>b.onclick=()=>useSpell(b.dataset.useSpell));root.querySelectorAll('[data-use-feature]').forEach(b=>b.onclick=()=>useFeature(b.dataset.useFeature));root.querySelectorAll('[data-edit-spell]').forEach(b=>b.onclick=()=>openSpell(b.dataset.editSpell));root.querySelectorAll('[data-delete-spell]').forEach(b=>b.onclick=()=>deleteSpell(b.dataset.deleteSpell));root.querySelectorAll('[data-edit-feature]').forEach(b=>b.onclick=()=>openFeature(b.dataset.editFeature));root.querySelectorAll('[data-delete-feature]').forEach(b=>b.onclick=()=>deleteFeature(b.dataset.deleteFeature))}
function spellPane(c){const slots=Array.from({length:9},(_,i)=>i+1).filter(n=>c.slots[n]?.max>0);const leveled=c.spells.filter(s=>s.level>0),cantrips=c.spells.filter(s=>s.level===0);return`<div class="card"><div class="card-head"><div><h2>Espaços de magia</h2><div class="sub">Toque em − para gastar ou + para recuperar um espaço.</div></div></div>${slots.length?`<div class="slots">${slots.map(n=>`<div class="slot"><div class="slot-level">Nível ${n}</div><div class="slot-count">${c.slots[n].current}<span style="color:var(--muted);font-size:13px"> / ${c.slots[n].max}</span></div><div class="slot-actions"><button class="icon-btn" aria-label="Gastar espaço" data-slot="${n}" data-delta="-1">−</button><button class="icon-btn" aria-label="Recuperar espaço" data-slot="${n}" data-delta="1">+</button></div></div>`).join('')}</div>`:`<div class="empty-state">Configure os espaços de magia ao editar o personagem.</div>`}</div>
<div class="card"><div class="card-head"><div><h2>Magias preparadas</h2><div class="sub">Use a magia para gastar um espaço do nível escolhido.</div></div><button class="btn gold" id="addSpell">＋ Adicionar</button></div>${leveled.length?`<div class="spell-grid">${leveled.map(s=>`<div class="spell-row"><span class="spell-level">Nível ${s.level}</span><div class="spell-info"><div class="spell-name">${esc(s.name)}</div>${s.note?`<div class="spell-note">${esc(s.note)}</div>`:''}</div><div class="spell-actions"><button class="btn use-btn" data-use-spell="${s.id}">Usar</button><button class="icon-btn" title="Editar" data-edit-spell="${s.id}">✎</button><button class="icon-btn danger-icon" title="Apagar" aria-label="Apagar magia" data-delete-spell="${s.id}">×</button></div></div>`).join('')}</div>`:`<div class="empty-state"><b>Nenhuma magia cadastrada</b>Adicione suas magias para acompanhar os usos durante a sessão.</div>`}</div>
<div class="card"><div class="card-head"><div><h2>Truques</h2><div class="sub">Truques são ilimitados e não consomem espaços.</div></div><button class="btn" id="addCantrip">＋ Adicionar</button></div>${cantrips.length?`<div class="spell-grid">${cantrips.map(s=>`<div class="spell-row"><span class="pill">Ilimitado</span><div class="spell-info"><div class="spell-name">${esc(s.name)}</div>${s.note?`<div class="spell-note">${esc(s.note)}</div>`:''}</div><div class="spell-actions"><button class="icon-btn" title="Editar" data-edit-spell="${s.id}">✎</button><button class="icon-btn danger-icon" title="Apagar" aria-label="Apagar magia" data-delete-spell="${s.id}">×</button></div></div>`).join('')}</div>`:`<div class="empty-state">Nenhum truque cadastrado.</div>`}</div>`}
function featurePane(c){return`<div class="card"><div class="card-head"><div><h2>Habilidades e recursos</h2><div class="sub">Configure o limite de usos e quando cada recurso recarrega.</div></div><button class="btn gold" id="addFeature">＋ Adicionar</button></div>${c.features.length?`<div class="spell-grid">${c.features.map(f=>`<div class="feature-row"><span class="feature-kind">${esc(f.kind||'Recurso')}</span><div class="spell-info"><div class="spell-name">${esc(f.name)}</div><div class="spell-note">${f.max>0?`Recarga no descanso ${f.recovery==='short'?'curto':'longo'}`:'Uso ilimitado'}${f.note?' · '+esc(f.note):''}</div></div><div class="spell-actions">${f.max>0?`<span class="pill">${f.current}/${f.max}</span><button class="btn use-btn" data-use-feature="${f.id}" ${f.current<1?'disabled':''}>Usar</button>`:''}<button class="icon-btn" title="Editar" data-edit-feature="${f.id}">✎</button><button class="icon-btn danger-icon" title="Apagar" aria-label="Apagar habilidade" data-delete-feature="${f.id}">×</button></div></div>`).join('')}</div>`:`<div class="empty-state"><b>Nenhum recurso cadastrado</b>Adicione habilidades de classe, raça, talentos e outros recursos.</div>`}</div>`}
function openModal(html){const w=document.getElementById('modalWrap');document.getElementById('modal').innerHTML=html;w.classList.add('open')}function closeModal(){document.getElementById('modalWrap').classList.remove('open')}document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

'slot'+n)||0)),prev=c.slots[n]?.current??max;c.slots[n]={max,current:Math.min(max,prev),recovery:'long'}}if(!old)state.characters.push(c);state.activeId=c.id;save();closeModal();render();showToast(old?'Personagem atualizado':'Personagem criado')}}
function openSpell(sid=null,forceCantrip=false){const c=current(),old=sid?c.spells.find(s=>s.id===sid):null;openModal(`<h2>${old?'Editar magia':'Adicionar magia'}</h2><div class="modal-desc">Cadastre uma magia ou truque no grimório deste personagem.</div><form id="spellForm"><div class="field"><label>Nome *</label><input name="name" required maxlength="70" value="${esc(old?.name||'')}" placeholder="Ex.: Mísseis Mágicos"></div><div class="field"><label>Nível</label><select name="level">${Array.from({length:10},(_,n)=>`<option value="${n}" ${((old?.level??(forceCantrip?0:1))===n)?'selected':''}>${n===0?'Truque (ilimitado)':'Nível '+n}</option>`).join('')}</select></div><div class="field"><label>Notas (opcional)</label><input name="note" maxlength="140" value="${esc(old?.note||'')}" placeholder="Alcance, concentração, componente..."></div><div class="modal-actions"><button type="button" class="btn" data-cancel>Cancelar</button><button class="btn gold">Salvar magia</button></div></form>`);document.querySelector('[data-cancel]').onclick=closeModal;document.querySelector('#spellForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),spell={id:old?.id||id(),name:d.get('name').trim(),level:+d.get('level'),note:d.get('note').trim()};if(old)Object.assign(old,spell);else c.spells.push(spell);save();closeModal();renderMain();showToast(old?'Magia atualizada':'Magia adicionada')}}
function openFeature(fid=null){const c=current(),old=fid?c.features.find(f=>f.id===fid):null;openModal(`<h2>${old?'Editar habilidade':'Adicionar habilidade'}</h2><div class="modal-desc">Defina os usos disponíveis e o tipo de descanso que restaura este recurso.</div><form id="featureForm"><div class="field"><label>Nome *</label><input name="name" required maxlength="70" value="${esc(old?.name||'')}" placeholder="Ex.: Inspiração Bárdica"></div><div class="form-row"><div class="field"><label>Tipo</label><input name="kind" maxlength="30" value="${esc(old?.kind||'Habilidade')}" placeholder="Classe, raça, talento..."></div><div class="field"><label>Usos máximos (0 = ilimitado)</label><input name="max" type="number" min="0" max="99" value="${old?.max??1}"></div></div><div class="field"><label>Recupera em</label><select name="recovery"><option value="short" ${old?.recovery==='short'?'selected':''}>Descanso curto</option><option value="long" ${old?.recovery!=='short'?'selected':''}>Descanso longo</option></select></div><div class="field"><label>Notas (opcional)</label><input name="note" maxlength="140" value="${esc(old?.note||'')}" placeholder="Dado, efeito ou condição"></div><div class="modal-actions"><button type="button" class="btn" data-cancel>Cancelar</button><button class="btn gold">Salvar habilidade</button></div></form>`);document.querySelector('[data-cancel]').onclick=closeModal;document.querySelector('#featureForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),max=Math.max(0,Math.min(99,+d.get('max')||0)),f={id:old?.id||id(),name:d.get('name').trim(),kind:d.get('kind').trim()||'Recurso',max,current:old?Math.min(max,+old.current):max,recovery:d.get('recovery'),note:d.get('note').trim()};if(old)Object.assign(old,f);else c.features.push(f);save();closeModal();renderMain();showToast(old?'Habilidade atualizada':'Habilidade adicionada')}}
function confirmRest(type){const label=type==='short'?'curto':'longo';openModal(`<h2>Confirmar descanso ${label}?</h2><div class="modal-desc">Os recursos marcados para descanso ${label} serão restaurados ao máximo.</div><div class="danger-note">Habilidades configuradas para este descanso serão restauradas. Espaços de magia retornam somente no descanso longo.</div><div class="modal-actions"><button class="btn" data-cancel>Cancelar</button><button class="btn gold" id="confirmRestBtn">Confirmar descanso</button></div>`);document.querySelector('[data-cancel]').onclick=closeModal;document.querySelector('#confirmRestBtn').onclick=()=>{const c=current();c.features.forEach(f=>{if(f.max>0&&(type==='long'||f.recovery==='short'))f.current=f.max});if(type==='long')Object.values(c.slots).forEach(s=>s.current=s.max);save();closeModal();renderMain();showToast(`Descanso ${label}: recursos restaurados`)}}

function adjustSlot(n,delta){const c=current(),s=c.slots[n];s.current=Math.max(0,Math.min(s.max,s.current+delta));save();renderMain()}function useSpell(sid){const c=current(),s=c.spells.find(x=>x.id===sid),available=Object.entries(c.slots).filter(([n,x])=>+n>=s.level&&x.current>0).sort((a,b)=>+a[0]-+b[0]);if(!available.length){showToast('Sem espaços de magia disponíveis');return}const [n,slot]=available[0];slot.current--;save();renderMain();showToast(`${s.name}: espaço de nível ${n} usado`)}function useFeature(fid){const f=current().features.find(x=>x.id===fid);if(!f||f.max<1)return;if(f.current<1){showToast('Sem usos disponíveis');return}f.current--;save();renderMain();showToast(`${f.name}: uso registrado`)}function deleteSpell(sid){const c=current(),s=c.spells.find(x=>x.id===sid);openModal(`<h2>Remover ${esc(s.name)}?</h2><div class="modal-desc">Esta magia será removida do grimório.</div><div class="modal-actions"><button class="btn" data-cancel>Cancelar</button><button class="btn danger" id="confirmRemove">Remover</button></div>`);document.querySelector('[data-cancel]').onclick=closeModal;document.querySelector('#confirmRemove').onclick=()=>{c.spells=c.spells.filter(x=>x.id!==sid);save();closeModal();renderMain()}}function deleteFeature(fid){const c=current(),f=c.features.find(x=>x.id===fid);openModal(`<h2>Remover ${esc(f.name)}?</h2><div class="modal-desc">Esta habilidade e seu contador serão removidos.</div><div class="modal-actions"><button class="btn" data-cancel>Cancelar</button><button class="btn danger" id="confirmRemove">Remover</button></div>`);document.querySelector('[data-cancel]').onclick=closeModal;document.querySelector('#confirmRemove').onclick=()=>{c.features=c.features.filter(x=>x.id!==fid);save();closeModal();renderMain()}}
document.getElementById('newCharacterBtn').onclick=()=>openCharacter();document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='grimorio-dnd5e.json';a.click();URL.revokeObjectURL(a.href);showToast('Dados exportados')};
render();

function showCatalog(root,c){root.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.catalogTab==='1'));root.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));let panel=root.querySelector('#catalogPane');if(!panel){panel=document.createElement('section');panel.id='catalogPane';panel.className='tab-pane active';panel.innerHTML=`<div class="catalog-card"><h3 class="sheet-title">Grimório · D&D 5e (2014)</h3><div class="catalog-tools"><input id="catalogSearch" placeholder="Buscar magia pelo nome…"><div class="filter-pills"><button class="filter-pill active" data-level="all">Todas</button><button class="filter-pill" data-level="0">Truques</button>${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="filter-pill" data-level="${n}">Nível ${n}</button>`).join('')}</div><select id="schoolFilter"><option value="all">Todas as escolas</option>${[...new Set(SPELL_CATALOG.map(s=>s.school))].sort().map(s=>`<option>${s}</option>`).join('')}</select><select id="spellStatus"><option value="known">Adicionar como conhecida</option><option value="prepared">Adicionar como preparada</option><option value="both">Conhecida e preparada</option></select></div><div id="catalogList" class="catalog-list"></div><p class="install-hint">Catálogo inicial ilustrativo; adicione outras magias manualmente ao seu personagem.</p></div>`;root.append(panel)}panel.classList.add('active');const search=panel.querySelector('#catalogSearch'),school=panel.querySelector('#schoolFilter'),list=panel.querySelector('#catalogList');let level='all';function paint(){const query=search.value.toLocaleLowerCase('pt-BR'),found=SPELL_CATALOG.filter(s=>(level==='all'||s.level===+level)&&(school.value==='all'||school.value===s.school)&&s.name.toLocaleLowerCase('pt-BR').includes(query));list.innerHTML=found.map(s=>{const selected=c.spells.some(x=>x.name.toLocaleLowerCase('pt-BR')===s.name.toLocaleLowerCase('pt-BR'));return`<details class="catalog-spell"><summary><span class="spell-glyph">✧</span><span><b>${esc(s.name)}</b><small>${s.level===0?'Truque':'Nível '+s.level} · ${esc(s.school)}${selected?' · No grimório':''}</small></span></summary><div class="catalog-body">${esc(s.desc)}<br><button class="btn ${selected?'':'gold'}" data-add-catalog="${esc(s.name)}">${selected?'Atualizar seleção':'Adicionar ao grimório'}</button></div></details>`}).join('')||'<div class="empty-state">Nenhuma magia encontrada.</div>';list.querySelectorAll('[data-add-catalog]').forEach(b=>b.onclick=()=>{const s=SPELL_CATALOG.find(x=>x.name===b.dataset.addCatalog);const exists=c.spells.find(x=>x.name===s.name);const status=panel.querySelector('#spellStatus').value;if(exists){exists.known=status!=='prepared';exists.prepared=status!=='known'}else c.spells.push({id:id(),name:s.name,level:s.level,note:s.school+' · '+s.desc,school:s.school,known:status!=='prepared',prepared:status!=='known'});save();paint();showToast(s.name+' adicionada ao grimório')})}search.oninput=paint;school.onchange=paint;panel.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;panel.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));paint()});paint()}
